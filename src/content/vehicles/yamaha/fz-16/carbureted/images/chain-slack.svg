<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="system-ui, sans-serif">
  <rect width="800" height="300" rx="16" fill="#12161b"/>
  <text x="40" y="46" fill="#e9eef3" font-size="20" font-weight="700">Dónde se mide la holgura de la cadena</text>

  <!-- sprockets -->
  <circle cx="170" cy="160" r="26" fill="#181d24" stroke="#8d99a8" stroke-width="3"/>
  <circle cx="170" cy="160" r="5" fill="#8d99a8"/>
  <circle cx="620" cy="160" r="64" fill="#181d24" stroke="#8d99a8" stroke-width="3"/>
  <circle cx="620" cy="160" r="7" fill="#8d99a8"/>

  <!-- chain: upper run tight, lower run sagging -->
  <path d="M168 134 L614 96" fill="none" stroke="#e9eef3" stroke-width="5" stroke-linecap="round"/>
  <path d="M172 186 Q396 236 618 224" fill="none" stroke="#e9eef3" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M172 186 Q396 236 618 224" fill="none" stroke="#e9eef3" stroke-width="1.5" opacity="0.5"/>

  <!-- slack arrow at mid span -->
  <path d="M396 196 V246" stroke="#ff5a1f" stroke-width="3"/>
  <path d="M388 204 L396 194 L404 204 M388 238 L396 248 L404 238" fill="none" stroke="#ff5a1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="414" y="268" fill="#ff5a1f" font-size="18" font-weight="700">30 – 40 mm</text>

  <!-- labels -->
  <g fill="#8d99a8" font-size="13" text-anchor="middle">
    <text x="170" y="112">Piñón de salida</text>
    <text x="620" y="258">Corona (eje trasero)</text>
  </g>
  <text x="396" y="182" fill="#4db5ff" font-size="13" font-weight="600" text-anchor="middle">Mitad del tramo</text>
  <text x="40" y="282" fill="#8d99a8" font-size="13">Mide en el punto más tenso, girando la rueda.</text>
</svg>

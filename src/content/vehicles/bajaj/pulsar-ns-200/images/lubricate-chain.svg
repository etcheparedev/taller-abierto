<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8d99a8"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="16" fill="#12161b"/>
  <text x="40" y="46" fill="#e9eef3" font-size="20" font-weight="700">Dónde y cómo rociar el lubricante</text>

  <!-- rear sprocket -->
  <circle cx="610" cy="250" r="60" fill="#181d24" stroke="#8d99a8" stroke-width="3" stroke-dasharray="6 7"/>
  <circle cx="610" cy="250" r="14" fill="#242b35"/>
  <text x="610" y="336" fill="#8d99a8" font-size="14" text-anchor="middle">Piñón trasero</text>

  <!-- chain -->
  <path d="M90 190 H610 A60 60 0 0 1 610 310 H90" fill="none" stroke="#e9eef3" stroke-width="7" stroke-dasharray="14 5"/>
  <path d="M150 250 H96" stroke="#8d99a8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="160" y="255" fill="#8d99a8" font-size="14">hacia el motor</text>

  <!-- spray can with extension tube -->
  <rect x="250" y="76" width="46" height="72" rx="8" fill="#ff5a1f"/>
  <rect x="262" y="62" width="22" height="14" rx="3" fill="#8d99a8"/>
  <path d="M284 68 H380 V150" fill="none" stroke="#ff5a1f" stroke-width="3"/>
  <path d="M380 150 L364 186 H396 Z" fill="#ff5a1f" opacity="0.3"/>
  <text x="238" y="106" fill="#e9eef3" font-size="14" text-anchor="end">Lata con tubo</text>
  <text x="238" y="124" fill="#e9eef3" font-size="14" text-anchor="end">de extensión</text>

  <!-- distance -->
  <path d="M412 150 V186 M405 150 H419 M405 186 H419" stroke="#3ddc97" stroke-width="2"/>
  <text x="426" y="173" fill="#3ddc97" font-size="15" font-weight="700">5 – 10 cm</text>

  <text x="380" y="222" fill="#3ddc97" font-size="14" font-weight="600" text-anchor="middle">Rocía en el centro de la cadena</text>

  <!-- wheel rotation -->
  <path d="M700 300 A95 95 0 0 0 700 200" fill="none" stroke="#8d99a8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="716" y="246" fill="#8d99a8" font-size="14">Gira la</text>
  <text x="716" y="264" fill="#8d99a8" font-size="14">rueda</text>
</svg>

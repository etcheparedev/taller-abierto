<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <marker id="hot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff5a1f"/>
    </marker>
    <marker id="cold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4db5ff"/>
    </marker>
    <marker id="bypass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f5b83d"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="16" fill="#12161b"/>
  <text x="40" y="46" fill="#e9eef3" font-size="20" font-weight="700">Recorrido del refrigerante</text>

  <!-- hot path along the top row -->
  <g fill="none" stroke="#ff5a1f" stroke-width="2.5" marker-end="url(#hot)">
    <path d="M190 112 H226"/>
    <path d="M380 112 H416"/>
    <path d="M570 112 H606"/>
    <path d="M700 144 V312 H574"/>
  </g>
  <!-- cooled return -->
  <path d="M420 312 H100 V148" fill="none" stroke="#4db5ff" stroke-width="2.5" marker-end="url(#cold)"/>
  <!-- bypass while cold -->
  <path d="M650 144 V214 H150 V148" fill="none" stroke="#f5b83d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#bypass)"/>

  <!-- components -->
  <g fill="#181d24" stroke="#242b35" stroke-width="1.5">
    <rect x="40" y="80" width="150" height="64" rx="12"/>
    <rect x="230" y="80" width="150" height="64" rx="12"/>
    <rect x="420" y="80" width="150" height="64" rx="12"/>
    <rect x="610" y="80" width="150" height="64" rx="12"/>
    <rect x="420" y="280" width="150" height="64" rx="12"/>
  </g>
  <g fill="#e9eef3" font-size="17" font-weight="700" text-anchor="middle">
    <text x="115" y="118">Bomba</text>
    <text x="305" y="118">Cilindro</text>
    <text x="495" y="118">Culata</text>
    <text x="685" y="118">Termostato</text>
    <text x="495" y="318">Radiador</text>
  </g>

  <!-- labels -->
  <g font-size="14" font-weight="600">
    <text x="400" y="204" fill="#f5b83d" text-anchor="middle">Menos de 82 °C: vuelve por el tubo de derivación</text>
    <text x="712" y="250" fill="#ff5a1f">Más de</text>
    <text x="712" y="268" fill="#ff5a1f">82 °C</text>
    <text x="260" y="302" fill="#4db5ff" text-anchor="middle">Refrigerante enfriado</text>
  </g>
  <g fill="#8d99a8" font-size="12.5">
    <text x="582" y="336">entrada: arriba, lado izquierdo</text>
    <text x="408" y="336" text-anchor="end">salida: abajo, lado derecho</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="system-ui, sans-serif">
  <rect width="800" height="420" rx="16" fill="#12161b"/>
  <text x="40" y="46" fill="#e9eef3" font-size="20" font-weight="700">Orden de los engranajes en la caja de 6 velocidades</text>

  <!-- shafts -->
  <rect x="150" y="136" width="560" height="14" rx="7" fill="#8d99a8"/>
  <rect x="90" y="266" width="560" height="14" rx="7" fill="#8d99a8"/>
  <text x="600" y="82" fill="#e9eef3" font-size="14" font-weight="700" text-anchor="end">Eje de entrada</text>
  <text x="608" y="82" fill="#8d99a8" font-size="13">lado del embrague →</text>
  <text x="90" y="350" fill="#8d99a8" font-size="13">← lado del piñón de la cadena</text>
  <text x="290" y="350" fill="#e9eef3" font-size="14" font-weight="700">Eje de salida</text>

  <!-- input shaft gears: 2, 5, 3-4, 6, 1 -->
  <g stroke-width="2">
    <rect x="180" y="108" width="50" height="70" rx="8" fill="#181d24" stroke="#f5b83d"/>
    <rect x="262" y="96" width="50" height="94" rx="8" fill="#181d24" stroke="#4db5ff"/>
    <rect x="344" y="102" width="110" height="82" rx="8" fill="#181d24" stroke="#3ddc97"/>
    <rect x="486" y="92" width="50" height="102" rx="8" fill="#181d24" stroke="#4db5ff"/>
    <rect x="568" y="118" width="50" height="50" rx="8" fill="#181d24" stroke="#f5b83d"/>
  </g>
  <g fill="#e9eef3" font-size="17" font-weight="700" text-anchor="middle">
    <text x="205" y="126">2.ª</text>
    <text x="287" y="116">5.ª</text>
    <text x="399" y="122">3.ª – 4.ª</text>
    <text x="511" y="112">6.ª</text>
    <text x="593" y="134">1.ª</text>
  </g>

  <!-- output shaft driven gears -->
  <g stroke-width="2">
    <rect x="180" y="226" width="50" height="94" rx="8" fill="#181d24" stroke="#4db5ff"/>
    <rect x="262" y="238" width="50" height="70" rx="8" fill="#181d24" stroke="#3ddc97"/>
    <rect x="344" y="232" width="50" height="82" rx="8" fill="#181d24" stroke="#4db5ff"/>
    <rect x="404" y="236" width="50" height="74" rx="8" fill="#181d24" stroke="#4db5ff"/>
    <rect x="486" y="242" width="50" height="62" rx="8" fill="#181d24" stroke="#3ddc97"/>
    <rect x="568" y="216" width="50" height="114" rx="8" fill="#181d24" stroke="#4db5ff"/>
  </g>
  <g fill="#e9eef3" font-size="17" font-weight="700" text-anchor="middle">
    <text x="205" y="312">2.ª</text>
    <text x="287" y="300">5.ª</text>
    <text x="369" y="306">3.ª</text>
    <text x="429" y="302">4.ª</text>
    <text x="511" y="296">6.ª</text>
    <text x="593" y="322">1.ª</text>
  </g>

  <!-- legend -->
  <g font-size="14">
    <rect x="150" y="378" width="18" height="18" rx="4" fill="none" stroke="#f5b83d" stroke-width="2"/>
    <text x="176" y="392" fill="#e9eef3">Fijo al eje</text>
    <rect x="290" y="378" width="18" height="18" rx="4" fill="none" stroke="#4db5ff" stroke-width="2"/>
    <text x="316" y="392" fill="#e9eef3">Gira libre</text>
    <rect x="430" y="378" width="18" height="18" rx="4" fill="none" stroke="#3ddc97" stroke-width="2"/>
    <text x="456" y="392" fill="#e9eef3">Deslizante (lo mueve una horquilla)</text>
  </g>
</svg>

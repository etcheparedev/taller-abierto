tables:
  - title: Programa de mantenimiento periódico
    note: "Servicios: 1.º a los 450–500 km, 2.º a los 2450–2500, 3.º a los 4950–5000, 4.º a los 7450–7500, 5.º a los 9950–10 000, 6.º a los 12 450–12 500 y 7.º a los 14 950–15 000 km. El manual recomienda aceite genuino Bajaj; con otro aceite de la misma especificación, el cambio pasa a ser cada 2500 km. Los elementos marcados con ** aplican según el modelo y los marcados con *** necesitan limpieza más frecuente en zonas polvorientas. El manual se contradice en varios intervalos: para las bujías indica cambio en el 7.º servicio (este cuadro), cada 10 000 km (procedimiento de mantenimiento) y cada 30 000 km (puesta a punto); para el filtro de aire, cambio en el 4.º y 7.º servicio (este cuadro), cada 10 000 km (procedimiento de limpieza) y cada 15 000 km (puesta a punto); para el refrigerante, cambio en el 7.º servicio (este cuadro) y cada 30 000 km (procedimiento de cambio); y este cuadro anota aceite SAE 10W50 mientras el resto del manual pide SAE 20W50."
    columns: [Elemento, Operación, Servicios, Observaciones]
    rows:
      - ["Lavado y secado de la moto", "Limpiar", "1.º a 7.º", "Sin dejar entrar agua al tanque, al silenciador ni a las partes eléctricas; usar detergente no cáustico"]

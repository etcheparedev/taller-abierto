<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <rect width="800" height="460" rx="16" fill="#12161b"/>
  <text x="40" y="46" fill="#e9eef3" font-size="20" font-weight="700">Qué entra y qué sale de la ECU</text>

  <text x="140" y="84" fill="#4db5ff" font-size="14" font-weight="700" text-anchor="middle">Sensores</text>
  <text x="660" y="84" fill="#f5b83d" font-size="14" font-weight="700" text-anchor="middle">Actuadores</text>

  <!-- sensors -->
  <g font-size="13" fill="#e9eef3">
    <g fill="#181d24" stroke="#4db5ff" stroke-width="1.5">
      <rect x="40" y="98" width="200" height="30" rx="8"/>
      <rect x="40" y="138" width="200" height="30" rx="8"/>
      <rect x="40" y="178" width="200" height="30" rx="8"/>
      <rect x="40" y="218" width="200" height="30" rx="8"/>
      <rect x="40" y="258" width="200" height="30" rx="8"/>
      <rect x="40" y="298" width="200" height="30" rx="8"/>
      <rect x="40" y="338" width="200" height="30" rx="8"/>
      <rect x="40" y="378" width="200" height="30" rx="8"/>
    </g>
    <g text-anchor="middle">
      <text x="140" y="118">Ángulo del cigüeñal</text>
      <text x="140" y="158">Posición del acelerador (TPS)</text>
      <text x="140" y="198">Presión y temp. de admisión</text>
      <text x="140" y="238">Temperatura del refrigerante</text>
      <text x="140" y="278">Oxígeno (lambda)</text>
      <text x="140" y="318">Velocidad de la rueda</text>
      <text x="140" y="358">Gato lateral</text>
      <text x="140" y="398">Vuelco</text>
    </g>
  </g>

  <!-- ECU -->
  <rect x="330" y="178" width="140" height="150" rx="14" fill="#181d24" stroke="#3ddc97" stroke-width="3"/>
  <text x="400" y="246" fill="#3ddc97" font-size="26" font-weight="700" text-anchor="middle">ECU</text>
  <text x="400" y="270" fill="#8d99a8" font-size="12" text-anchor="middle">inyección y encendido</text>
  <text x="400" y="288" fill="#8d99a8" font-size="12" text-anchor="middle">códigos de falla</text>

  <!-- arrows in -->
  <g stroke="#4db5ff" stroke-width="1.5" fill="none">
    <path d="M240 113 L326 200"/>
    <path d="M240 153 L326 216"/>
    <path d="M240 193 L326 232"/>
    <path d="M240 233 L326 246"/>
    <path d="M240 273 L326 262"/>
    <path d="M240 313 L326 278"/>
    <path d="M240 353 L326 294"/>
    <path d="M240 393 L326 310"/>
  </g>

  <!-- arrows out -->
  <g stroke="#f5b83d" stroke-width="1.5" fill="none">
    <path d="M474 200 L560 113"/>
    <path d="M474 216 L560 153"/>
    <path d="M474 232 L560 193"/>
    <path d="M474 246 L560 233"/>
    <path d="M474 262 L560 273"/>
    <path d="M474 278 L560 313"/>
    <path d="M474 294 L560 353"/>
    <path d="M474 310 L560 393"/>
  </g>

  <!-- actuators -->
  <g font-size="13" fill="#e9eef3">
    <g fill="#181d24" stroke="#f5b83d" stroke-width="1.5">
      <rect x="560" y="98" width="200" height="30" rx="8"/>
      <rect x="560" y="138" width="200" height="30" rx="8"/>
      <rect x="560" y="178" width="200" height="30" rx="8"/>
      <rect x="560" y="218" width="200" height="30" rx="8"/>
      <rect x="560" y="258" width="200" height="30" rx="8"/>
      <rect x="560" y="298" width="200" height="30" rx="8"/>
      <rect x="560" y="338" width="200" height="30" rx="8"/>
      <rect x="560" y="378" width="200" height="30" rx="8"/>
    </g>
    <g text-anchor="middle">
      <text x="660" y="118">Relé principal</text>
      <text x="660" y="158">Bomba de combustible</text>
      <text x="660" y="198">Inyector</text>
      <text x="660" y="238">Motor paso a paso (ralentí)</text>
      <text x="660" y="278">Bobinas de alta 1 y 2</text>
      <text x="660" y="318">Ventilador del radiador</text>
      <text x="660" y="358">Testigo de falla (MIL)</text>
      <text x="660" y="398">Conector de diagnóstico</text>
    </g>
  </g>
  <text x="40" y="438" fill="#8d99a8" font-size="13">Los sensores miden; la ECU calcula y ordena; los actuadores ejecutan.</text>
</svg>

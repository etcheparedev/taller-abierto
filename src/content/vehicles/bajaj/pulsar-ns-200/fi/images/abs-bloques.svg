<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="system-ui, 'Segoe UI', sans-serif">
  <defs>
    <marker id="flu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff5a1f"/>
    </marker>
    <marker id="sig" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4db5ff"/>
    </marker>
  </defs>
  <rect width="800" height="430" rx="16" fill="#12161b"/>
  <text x="40" y="46" fill="#e9eef3" font-size="20" font-weight="700">Cómo trabaja el ABS del freno delantero</text>

  <!-- ABS unit frame -->
  <rect x="260" y="90" width="300" height="250" rx="14" fill="none" stroke="#8d99a8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="410" y="80" fill="#8d99a8" font-size="14" font-weight="700" text-anchor="middle">UNIDAD DEL ABS (bajo el tanque)</text>

  <!-- blocks -->
  <g fill="#181d24" stroke="#242b35" stroke-width="2">
    <rect x="40" y="120" width="170" height="60" rx="12"/>
    <rect x="285" y="120" width="250" height="60" rx="12" stroke="#ff5a1f"/>
    <rect x="285" y="200" width="250" height="50" rx="12"/>
    <rect x="285" y="270" width="250" height="50" rx="12" stroke="#4db5ff"/>
    <rect x="610" y="120" width="150" height="60" rx="12"/>
    <rect x="610" y="270" width="150" height="50" rx="12" stroke="#4db5ff"/>
  </g>
  <g fill="#e9eef3" font-size="15" font-weight="700" text-anchor="middle">
    <text x="125" y="146">Palanca y bomba</text>
    <text x="125" y="166" font-size="13" font-weight="400" fill="#8d99a8">de freno delantero</text>
    <text x="410" y="146">Válvula de entrada</text>
    <text x="410" y="166" font-size="13" font-weight="400" fill="#8d99a8">abierta en frenado normal</text>
    <text x="410" y="222">Válvula de salida, depósito y bomba</text>
    <text x="410" y="240" font-size="13" font-weight="400" fill="#8d99a8">alivian y devuelven presión</text>
    <text x="410" y="292">Unidad de control</text>
    <text x="410" y="310" font-size="13" font-weight="400" fill="#8d99a8">gobierna válvulas y bomba</text>
    <text x="685" y="146">Pinza delantera</text>
    <text x="685" y="166" font-size="13" font-weight="400" fill="#8d99a8">y disco</text>
    <text x="685" y="292">Sensores de</text>
    <text x="685" y="310">velocidad de rueda</text>
  </g>

  <!-- fluid flow -->
  <g fill="none" stroke="#ff5a1f" stroke-width="3">
    <line x1="210" y1="150" x2="281" y2="150" marker-end="url(#flu)"/>
    <line x1="535" y1="150" x2="606" y2="150" marker-end="url(#flu)"/>
  </g>
  <!-- signals -->
  <g fill="none" stroke="#4db5ff" stroke-width="2.5">
    <line x1="610" y1="295" x2="539" y2="295" marker-end="url(#sig)"/>
    <line x1="410" y1="270" x2="410" y2="254" marker-end="url(#sig)"/>
  </g>

  <!-- legend -->
  <g font-size="14">
    <line x1="60" y1="378" x2="100" y2="378" stroke="#ff5a1f" stroke-width="3"/>
    <text x="110" y="383" fill="#e9eef3">Líquido de frenos</text>
    <line x1="290" y1="378" x2="330" y2="378" stroke="#4db5ff" stroke-width="2.5"/>
    <text x="340" y="383" fill="#e9eef3">Señal eléctrica</text>
  </g>
  <text x="60" y="408" fill="#8d99a8" font-size="14">Si el ABS falla, el freno sigue funcionando como un freno hidráulico normal.</text>
</svg>

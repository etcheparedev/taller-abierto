    note: "Servicios: 1.º a los 500–750 km (o 30–45 días), 2.º a los 4500–5000 km, 3.º a los 9500–10 000, 4.º a los 14 500–15 000, 5.º a los 19 500–20 000, 6.º a los 24 500–25 000 y 7.º a los 29 500–30 000 km; después, cada 5000 km. El cuadro del manual no tiene fila 39. Los elementos marcados con ** aplican según el modelo y los marcados con *** necesitan atención más frecuente en zonas polvorientas. El manual recomienda usar el aceite indicado en el manual de garantía o uno de las mismas especificaciones."

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="system-ui, 'Segoe UI', sans-serif">
  <rect width="800" height="360" rx="16" fill="#12161b"/>
  <text x="40" y="46" fill="#e9eef3" font-size="20" font-weight="700">Circuito de carga y puntos de medición</text>

  <!-- wires -->
  <g fill="none" stroke-width="3">
    <line x1="170" y1="140" x2="250" y2="140" stroke="#4db5ff"/>
    <line x1="170" y1="160" x2="250" y2="160" stroke="#4db5ff"/>
    <line x1="410" y1="150" x2="480" y2="150" stroke="#e9eef3"/>
    <line x1="560" y1="150" x2="630" y2="150" stroke="#e9eef3"/>
    <line x1="330" y1="190" x2="330" y2="230" stroke="#8d99a8"/>
  </g>

  <!-- blocks -->
  <g fill="#181d24" stroke="#242b35" stroke-width="2">
    <circle cx="110" cy="150" r="60"/>
    <rect x="250" y="110" width="160" height="80" rx="12"/>
    <rect x="480" y="125" width="80" height="50" rx="10" stroke="#ff5a1f"/>
    <rect x="630" y="110" width="130" height="80" rx="12"/>
  </g>
  <g fill="#e9eef3" font-size="15" font-weight="700" text-anchor="middle">
    <text x="110" y="146">Magneto</text>
    <text x="110" y="166" font-size="13" font-weight="400" fill="#8d99a8">bobina de carga</text>
    <text x="330" y="146">Regulador-</text>
    <text x="330" y="166">rectificador</text>
    <text x="520" y="156" fill="#ff5a1f">20 A</text>
    <text x="695" y="146">Batería</text>
    <text x="695" y="166" font-size="13" font-weight="400" fill="#8d99a8">12 V 8 Ah</text>
  </g>

  <!-- wire labels -->
  <g font-size="13" text-anchor="middle">
    <text x="210" y="128" fill="#4db5ff">2 × azul/blanco</text>
    <text x="445" y="138" fill="#e9eef3">blanco</text>
    <text x="595" y="138" fill="#e9eef3">blanco/negro</text>
    <text x="330" y="250" fill="#8d99a8">masa: negro/amarillo</text>
  </g>

  <!-- measurements -->
  <g font-size="14">
    <path d="M695 192 v40" stroke="#3ddc97" stroke-width="2" fill="none"/>
    <text x="695" y="254" fill="#3ddc97" font-weight="700" text-anchor="middle">Voltaje, en paralelo</text>
    <text x="695" y="274" fill="#e9eef3" text-anchor="middle">14.3 – 14.7 V</text>
    <path d="M520 177 v55" stroke="#3ddc97" stroke-width="2" fill="none"/>
    <text x="520" y="254" fill="#3ddc97" font-weight="700" text-anchor="middle">Corriente, en serie</text>
    <text x="520" y="274" fill="#e9eef3" text-anchor="middle">5 A máximo</text>
  </g>

  <text x="400" y="326" fill="#8d99a8" font-size="15" text-anchor="middle">Ambas mediciones a 4000 ± 25 rpm y con la batería totalmente cargada.</text>
</svg>
